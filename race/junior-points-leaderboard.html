<html lang="en">

    <style>
        :root {
            --navy: #16324f;
            --ocean: #1193d4;
            --ocean-dark: #0f6ca6;
            --aqua-tint: #edf8ff;
            --line: #dfe8ef;
            --ink: #2a3b4d;
            --muted: #5d6f84;
            --bg: #f6f9fc;
            --gold: #f5a623;
            --success: #2e7d32;
            --white: #ffffff;
            --shadow: rgba(16, 42, 66, 0.08);
        }

        body {
            background: var(--bg);
            font-family: 'Barlow', sans-serif;
            color: var(--ink);
        }

        .leaderboard-shell {
            max-width: 1500px;
            margin: 0 auto;
            padding: 26px 24px 76px;
        }

        .intro-wrap {
            max-width: 1100px;
            margin: 0 auto 28px;
            text-align: center;
        }

        .status-line {
            display: inline-block;
            width: min(100%, 900px);
            min-height: 38px;
            padding: 10px 18px;
            background: rgba(17, 147, 212, 0.08);
            border: 1px solid rgba(17, 147, 212, 0.18);
            /* border-radius: 999px; */
            color: var(--ocean-dark);
            font-size: 1.06rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            outline: none;
            box-shadow: 0 8px 18px rgba(12, 57, 88, 0.04);
        }

        .status-line:empty::before {
            content: 'After Club Race 1 (26 Sep 2026) · 7 races to go';
            color: var(--ocean-dark);
        }

        .explainer {
            margin: 16px auto 0;
            max-width: 820px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: center;
        }

        .points-card {



    margin: 0 auto 28px;
    background: var(--white);
    border: 1px solid var(--line);
    /* border-radius: 14px; */
    /* box-shadow: 0 10px 30px var(--shadow); */
    /* overflow: hidden; */
    max-width: 1100px;
    /* margin: 0 auto; */
    display: grid;

        }

        .points-card-header {
            padding: 14px 20px;
            background: linear-gradient(90deg, var(--navy), var(--ocean-dark));
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
        }

        .points-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(110px, 1fr));
        }

        .point-row {
            display: contents;
        }

        .points-label,
        .points-value {
            padding: 12px 14px;
            border-right: 1px solid var(--line);
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.96rem;
        }

        .points-label {
            background: #f8fbff;
            color: var(--muted);
            font-weight: 600;
        }

        .points-value {
            color: var(--navy);
            font-weight: 800;
            font-size: 1.15rem;
        }

        .points-value:last-child {
            border-right: none;
        }

        .category-stack {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            gap: 28px;
        }

        .category-card {
            background: var(--white);
            border: 1px solid var(--line);
            /* border-radius: 16px; */
            box-shadow: 0 10px 30px var(--shadow);
            overflow: hidden;
        }

        .category-head {
            background: linear-gradient(90deg, rgba(22, 50, 79, 0.98), rgba(17, 147, 212, 0.9));
            color: var(--white);
            padding: 18px 20px 16px;
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: center;
        }

        .category-name {
            /* font-family: 'Barlow Condensed', sans-serif; */
            font-weight: 700;
            /* font-size: clamp(1.6rem, 2vw, 2.2rem); */
            letter-spacing: 0.02em;
            line-height: 1.1;
        }

        .category-note {
            font-size: 0.84rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .category-body {
            padding: 18px 14px 20px;
        }

        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--line);
            /* border-radius: 12px; */
            background: #fff;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead th {
            background: #eaf5ff;
            color: var(--navy);
            border-bottom: 1px solid var(--line);
            padding: 12px 12px;
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: left;
            vertical-align: middle;
        }

        thead th.rank-col,
        tbody td.rank-col,
        thead th.name-col,
        tbody td.name-col,
        thead th.total-col,
        tbody td.total-col {
            white-space: nowrap;
        }

        tbody td {
            padding: 12px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
            color: var(--ink);
            background: var(--white);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr.leader td {
            background: rgba(17, 147, 212, 0.05);
            font-weight: 700;
        }

        tbody tr.leader td.name-col {
            color: var(--navy);
        }

        .rank-col {
            width: 78px;
            font-weight: 700;
            color: var(--ocean-dark);
        }

        .name-col {
            min-width: 170px;
        }

        .age-col,
        .race-col {
            width: 90px;
            color: var(--muted);
        }

        .score-col {
            width: 86px;
            text-align: center;
            font-weight: 700;
            color: var(--navy);
        }

        .score-col.zero {
            color: var(--muted);
        }

        .total-col {
            width: 96px;
            font-weight: 800;
            color: var(--navy);
            text-align: center;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            font-size: 1.06rem;
            color: var(--muted);
            background: #f9fbfd;
            border: 1px solid var(--line);
            /* border-radius: 12px; */
            padding: 18px 20px;
        }

        .category-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        .gender-title {
            /* font-family: 'Barlow Condensed', sans-serif; */
            font-weight: 700;
            /* font-size: 1.28rem; */
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--navy);
            margin: 0;
        }

        .table-wrap.sticky-guard th:first-child,
        .table-wrap.sticky-guard td:first-child,
        .table-wrap.sticky-guard th:nth-child(2),
        .table-wrap.sticky-guard td:nth-child(2),
        .table-wrap.sticky-guard th:last-child,
        .table-wrap.sticky-guard td:last-child {
            position: sticky;
            z-index: 1;
            background: var(--white);
        }

        .table-wrap.sticky-guard th:first-child,
        .table-wrap.sticky-guard td:first-child {
            left: 0;
            box-shadow: 1px 0 0 var(--line);
        }

        .table-wrap.sticky-guard th:nth-child(2),
        .table-wrap.sticky-guard td:nth-child(2) {
            left: 64px;
            box-shadow: 1px 0 0 var(--line);
        }

        .table-wrap.sticky-guard th:last-child,
        .table-wrap.sticky-guard td:last-child {
            right: 0;
            box-shadow: -1px 0 0 var(--line);
        }

        @media (max-width: 720px) {
            .leaderboard-shell {
                padding-left: 14px;
                padding-right: 14px;
            }

            .status-line {
                border-radius: 18px;
                line-height: 1.5;
                font-size: 0.98rem;
            }

            .points-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }

            .category-head {
                flex-direction: column;
                align-items: flex-start;
            }

            /* .table-wrap {
                border-radius: 10px;
            } */

            .table-wrap.sticky-guard th:first-child,
            .table-wrap.sticky-guard td:first-child,
            .table-wrap.sticky-guard th:nth-child(2),
            .table-wrap.sticky-guard td:nth-child(2),
            .table-wrap.sticky-guard th:last-child,
            .table-wrap.sticky-guard td:last-child {
                position: sticky;
            }
        }
    </style>
</head>
<body>
    <section id="header-placeholder"></section>
    <section id="title-placeholder" data-title="Junior Points Leaderboard"></section>

    <main class="leaderboard-shell">
        <div class="intro-wrap">
            <div id="leaderboard-status" class="status-line" contenteditable="true" spellcheck="false" aria-label="League status line">After Club Race 1 (26 Sep 2026) · 7 races to go</div>
            <p class="explainer">Categories follow AusTriathlon / NSW Triathlon age groups, based on age at 31 December 2026.</p>
        </div>

        <div class="points-card" aria-label="Junior points system">
            <div class="points-card-header">Points system</div>
            <div class="points-grid">
                <div class="points-label">1st</div>
                <div class="points-label">2nd</div>
                <div class="points-label">3rd</div>
                <div class="points-label">Finished</div>
                <div class="points-label">DNF</div>
                <div class="points-value">4</div>
                <div class="points-value">3</div>
                <div class="points-value">2</div>
                <div class="points-value">1</div>
                <div class="points-value">0</div>
            </div>
        </div>

        <div id="leaderboard-root" class="category-stack" aria-live="polite"></div>
    </main>

    <section id="footer-placeholder"></section>

    <script src="/assets/js/header.min.js"></script>
    <script src="/assets/js/title.min.js"></script>
    <script src="/assets/js/footer.min.js"></script>
    <script>
        const categories = [
            {
                title: 'Under 7',
                subtitle: 'born 2020+ · participation only, not eligible for points',
                athletes: {
                    Female: [
                        { name: 'Hallie Fifield', age: 6, race: 'Mini', results: [4] }
                    ],
                    Male: [
                        { name: 'Xavier Beukes', age: 5, race: 'Mini', results: [4] }
                    ]
                }
            },
            {
                title: 'Kids 7–9 (U10)',
                subtitle: 'born 2017–2019',
                athletes: {
                    Female: [
                        { name: 'Bonnie Stevens', age: 9, race: 'Youth C', results: [4] },
                        { name: 'Olive Richards', age: 8, race: 'Mini', results: [3] }
                    ],
                    Male: [
                        { name: 'Hudson Pattie', age: 9, race: 'Youth C', results: [4] }
                    ]
                }
            },
            {
                title: 'Kids 10–11 (U12)',
                subtitle: 'born 2015–2016',
                athletes: {
                    Female: [
                        { name: 'Eva Lichner', age: 11, race: 'Youth B', results: [4] },
                        { name: 'Isla Fifield', age: 10, race: 'Youth B', results: [3] },
                        { name: 'Giselle Degens', age: 11, race: 'Youth B', results: [2] },
                        { name: 'Zara Davies', age: 11, race: 'Youth B', results: [1] },
                        { name: 'Jasmine Spencer', age: 10, race: 'Youth C', results: [1] }
                    ],
                    Male: [
                        { name: 'Ewan Lichner', age: 11, race: 'Youth B', results: [4] },
                        { name: 'Lachy Coleman', age: 10, race: 'Youth B', results: [3] }
                    ]
                }
            },
            {
                title: 'Enticer 12–13 (U14)',
                subtitle: 'born 2013–2014',
                athletes: {
                    Female: [
                        { name: 'Amelie Targett', age: 12, race: 'Youth B', results: [4] },
                        { name: 'Harper Rosenfeld', age: 12, race: 'Youth B', results: [3] },
                        { name: 'Aurelie Degens', age: 12, race: 'Youth B', results: [2] },
                        { name: 'Elsie Pattie', age: 12, race: 'Youth B', results: [1] }
                    ],
                    Male: [
                        { name: 'Bert Jamieson', age: 13, race: 'Youth A', results: [4] },
                        { name: 'Logan Davies', age: 13, race: 'Youth A', results: [3] }
                    ]
                }
            },
            {
                title: 'Sprint 14–15 (U16)',
                subtitle: 'born 2011–2012',
                athletes: {
                    Female: [
                        { name: 'Olivia Davies', age: 14, race: 'Youth A', results: [4] },
                        { name: 'Mikayla Reay', age: 15, race: 'Junior B', results: [3] }
                    ],
                    Male: [
                        { name: 'Lachlan Targett', age: 15, race: 'Junior B', results: [4] },
                        { name: 'Harry Beukes', age: 14, race: 'Youth A', results: [0] }
                    ]
                }
            },
            {
                title: 'Junior 16–17 (U18)',
                subtitle: 'born 2009–2010',
                athletes: {
                    Female: [
                        { name: 'Ilona Ollivier', age: 16, race: 'Junior B', results: [4] }
                    ],
                    Male: []
                }
            },
            {
                title: 'Junior 18–19 (U20)',
                subtitle: 'born 2007–2008',
                athletes: {
                    Female: [],
                    Male: []
                }
            }
        ];

        function sumResults(results) {
            return (results || []).reduce((total, score) => total + Number(score || 0), 0);
        }

        function buildRaceColumns(athletes) {
            const maxLength = athletes.reduce((max, athlete) => Math.max(max, athlete.results.length || 1), 1);
            return Array.from({ length: maxLength }, (_, index) => `Race ${index + 1}`);
        }

        function rankDisplayFor(list, index) {
            if (index === 0) return '1';
            const current = list[index];
            const previous = list[index - 1];
            if (current.total === previous.total) {
                return '=' + previous.rankDisplay.replace('=', '');
            }
            return String(index + 1);
        }

        function renderTable(title, athleteList, raceColumns) {
            if (!athleteList || athleteList.length === 0) {
                return `
                    <div class="category-row">
                        <h3 class="gender-title">${title}</h3>
                        <div class="empty-state">No entrants yet</div>
                    </div>
                `;
            }

            const sorted = athleteList
                .map((athlete) => ({ ...athlete, total: sumResults(athlete.results) }))
                .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));

            let previousTotal = null;
            let previousRankValue = 0;

            sorted.forEach((athlete, index) => {
                if (index === 0) {
                    athlete.rankDisplay = '1';
                    previousTotal = athlete.total;
                    previousRankValue = 1;
                    return;
                }

                const tied = athlete.total === previousTotal;
                athlete.rankDisplay = tied ? '=' + previousRankValue : String(index + 1);
                if (!tied) {
                    previousRankValue = index + 1;
                    previousTotal = athlete.total;
                }
            });

            const leaderTotal = sorted[0] ? sorted[0].total : 0;

            const rows = sorted.map((athlete) => {
                const cells = [
                    `<td class="rank-col">${athlete.rankDisplay}</td>`,
                    `<td class="name-col">${escapeHtml(athlete.name)}</td>`,
                    `<td class="age-col">${athlete.age}</td>`,
                    `<td class="race-col">${escapeHtml(athlete.race)}</td>`
                ];

                raceColumns.forEach((race, raceIndex) => {
                    const value = athlete.results && athlete.results[raceIndex] !== undefined ? athlete.results[raceIndex] : 0;
                    const cls = value === 0 ? 'score-col zero' : 'score-col';
                    cells.push(`<td class="${cls}">${value}</td>`);
                });

                cells.push(`<td class="total-col">${athlete.total}</td>`);
                const isLeader = athlete.total === leaderTotal;
                return `<tr class="${isLeader ? 'leader' : ''}">${cells.join('')}</tr>`;
            }).join('');

            return `
                <div class="category-row">
                    <h3 class="gender-title">${title}</h3>
                    <div class="table-wrap sticky-guard">
                        <table>
                            <thead>
                                <tr>
                                    <th class="rank-col">Rank</th>
                                    <th class="name-col">Name</th>
                                    <th class="age-col">Age</th>
                                    <th class="race-col">Race</th>
                                    ${raceColumns.map((race) => `<th>${escapeHtml(race)}</th>`).join('')}
                                    <th class="total-col">Total</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderBoard() {
            const root = document.getElementById('leaderboard-root');

            root.innerHTML = categories.map((category) => {
                const genderGroups = Object.entries(category.athletes || {});
                const categoryRaceColumns = buildRaceColumns(Object.values(category.athletes || {}).flat());
                const tables = genderGroups.map(([gender, athletes]) => renderTable(gender, athletes, categoryRaceColumns)).join('');

                return `
                    <section class="category-card">
                        <div class="category-head">
                            <div class="category-name">${escapeHtml(category.title)}</div>
                            <div class="category-note">${escapeHtml(category.subtitle)}</div>
                        </div>
                        <div class="category-body">${tables}</div>
                    </section>
                `;
            }).join('');
        }

        const statusNode = document.getElementById('leaderboard-status');
        statusNode.addEventListener('blur', () => {
            const text = statusNode.textContent.trim();
            if (!text) {
                statusNode.textContent = 'After Club Race 1 (26 Sep 2026) · 7 races to go';
            }
        });

        renderBoard();
    </script>
</body>
</html>
